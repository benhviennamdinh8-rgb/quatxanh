name: Tu dong cap nhat truyen

on:
  schedule:
    # Chạy tự động vào 00:00 UTC (tương đương 07:00 sáng giờ Việt Nam) mỗi ngày
    - cron: '0 0 * * *'
  # Cho phép bạn nhấn nút chạy thủ công trên web bất cứ lúc nào
  workflow_dispatch:

jobs:
  auto-scrape-and-push:
    runs-on: ubuntu-latest

    steps:
      # 1. Tải mã nguồn từ GitHub về máy chủ ảo
      - name: Checkout code
        uses: actions/checkout@v3

      # 2. Cài đặt môi trường Python
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      # 3. Tự động cài các thư viện trong requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    	# 4. Chạy script cào truyện
- name: Run scraper script
  run: |
    python scraper.py

# 4.5. Tự động chuyển đổi các đường dẫn API local (An toàn nếu không có file JS)
- name: Auto fix local API to static JSON
  run: |
    shopt -s nullglob
    for f in *.js js/*.js; do
      if [ -f "$f" ]; then
        sed -i 's|http://127.0.0.1:8000/api/|./data/|g' "$f"
        sed -i 's|http://localhost:8000/api/|./data/|g' "$f"
        sed -i 's|http://127.0.0.1:8000/|./data/|g' "$f"
        sed -i 's|http://localhost:8000/|./data/|g' "$f"
      fi
    done

# 5. Tự động lưu và push file mới lên GitHub
- name: Commit and push changes
  run: |
    git config --global user.name "github-actions[bot]"
    git config --global user.email "github-actions[bot]@users.noreply.github.com"
    git add .
    git commit -m "Auto update content and static URLs from GitHub Actions" || exit 0
    git push